<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INCIDENCIAS - LINUM</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light; --c1:#388B8E; --c2:#48C1C4; --c3:#81BA83; --c4:#C2AF98;
          --texto:#1F2933; --suave:#5F6B7A; --borde:#DDE3EA; --fondo:#F6F8FB; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -10%, #EAF3F3 0%, var(--fondo) 55%);
         color:var(--texto); font:15px/1.5 "Aptos Narrow","Segoe UI",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .caja { width:100%; max-width:430px; background:#fff; border:1px solid var(--borde); border-radius:16px;
          box-shadow:0 18px 50px rgba(20,30,45,.12); overflow:hidden; }
  .caja::before { content:""; display:block; height:6px;
          background:linear-gradient(90deg,var(--c1) 0 25%,var(--c2) 25% 50%,var(--c3) 50% 75%,var(--c4) 75% 100%); }
  .cuerpo { padding:30px 34px 34px; }
  .logo { display:block; margin:0 auto 10px; max-height:150px; max-width:100%; object-fit:contain; }
  h1 { text-align:center; font-size:19px; font-weight:700; margin:4px 0 2px; letter-spacing:.01em; }
  .sub { text-align:center; color:var(--suave); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
          color:var(--suave); margin:14px 0 4px; }
  input { width:100%; font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--borde);
          border-radius:9px; background:#fff; color:var(--texto); }
  input:focus { outline:none; border-color:var(--c1); box-shadow:0 0 0 3px rgba(56,139,142,.15); }
  .pase { position:relative; }
  .pase button { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none;
          color:var(--suave); font-size:12px; cursor:pointer; padding:6px 8px; }
  .entrar { width:100%; margin-top:22px; font:inherit; font-size:15px; font-weight:700; color:#fff;
          background:var(--c1); border:0; border-radius:9px; padding:12px; cursor:pointer; }
  .entrar:hover { background:#2f787a; }
  .entrar:disabled { opacity:.6; cursor:default; }
  .aviso { margin-top:14px; font-size:13px; border-radius:9px; padding:10px 12px; display:none; }
  .aviso.err { display:block; background:#FBECEC; border:1px solid #E7B7B7; color:#9A3B3B; }
  .aviso.info { display:block; background:#EEF7F7; border:1px solid #CFE6E6; color:#2f6f70; }
  .pie { text-align:center; margin-top:22px; padding-top:16px; border-top:1px solid var(--borde); }
  .pie .restante { display:none; font-size:13px; font-weight:700; color:var(--c1); margin-bottom:8px; }
  .pie .restante.on { display:block; }
  .pie .restante.venc { color:#9A3B3B; }
  .pie .excl { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }
  .pie .cont { font-size:13px; color:var(--suave); margin-top:6px; }
  .pie .cont a { color:var(--c1); text-decoration:none; }
  .pie .cont a:hover { text-decoration:underline; }
  .pie .cont span { margin:0 6px; color:#C3CBD4; }
  .pie .marca { font-size:11px; color:#9AA5B3; margin-top:10px; }
  .carg { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.5);
          border-top-color:#fff; border-radius:50%; animation:g .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes g { to { transform:rotate(360deg); } }
</style>
</head>

<script>
(function () {
  'use strict';
  var C = JSON.parse(document.getElementById('cifrado').textContent.replace('/*__CIFRADO__*/', ''));
  var $ = function (id) { return document.getElementById(id); };
  var aviso = $('aviso');
  function msg(t, tipo) { aviso.textContent = t; aviso.className = 'aviso ' + tipo; }

  // tiempo restante (la fecha de vencimiento también va cifrada; esto es solo para mostrar)
  (function () {
    var r = $('restante');
    if (!C.exp) { r.textContent = 'Sin límite de tiempo'; r.className = 'restante on'; return; }
    var dias = Math.ceil((C.exp - Date.now()) / 86400000);
    if (dias > 0) { r.textContent = '⏳ Tiempo restante de uso: ' + dias + (dias === 1 ? ' día' : ' días'); r.className = 'restante on'; }
    else { r.textContent = 'El reporte venció. Solicite uno nuevo.'; r.className = 'restante on venc'; }
  })();

  $('ver').addEventListener('click', function () {
    var c = $('clave'); var m = c.type === 'password';
    c.type = m ? 'text' : 'password'; this.textContent = m ? 'Ocultar' : 'Mostrar';
  });

  // solo en línea y en la dirección oficial (una copia descargada no abre)
  var DOMINIO = 'gonzalezq0502-ux.github.io'.toLowerCase().replace(/^https?:\/\//, '').split('/')[0];
  if (DOMINIO && DOMINIO.indexOf('__') !== 0 && location.hostname.toLowerCase() !== DOMINIO) {
    msg('Este reporte solo puede abrirse en línea desde su dirección oficial: https://' + DOMINIO, 'err');
    $('entrar').disabled = true; $('correo').disabled = true; $('clave').disabled = true;
    return;
  }

  if (!window.crypto || !crypto.subtle) {
    msg('Este reporte necesita un navegador actualizado (Chrome, Edge, Safari o Firefox) y una conexión segura (https).', 'err');
    $('entrar').disabled = true;
  }

  var b64a = function (b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  var utf8 = function (s) { return new TextEncoder().encode(s); };
  var hex = function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); };
  var norm = function (s) { return (s || '').trim().toLowerCase(); };

  async function pbkdf2(pass, salt, iter, nbytes) {
    var base = await crypto.subtle.importKey('raw', utf8(pass), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, nbytes * 8);
    return new Uint8Array(bits);
  }
  async function hmacOk(macKey, data, mac) {
    var k = await crypto.subtle.importKey('raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    return crypto.subtle.verify('HMAC', k, mac, data);
  }
  async function aesDec(encKey, iv, ct) {
    var k = await crypto.subtle.importKey('raw', encKey, { name: 'AES-CBC' }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, k, ct));
  }
  function junta(a, b) { var r = new Uint8Array(a.length + b.length); r.set(a, 0); r.set(b, a.length); return r; }

  async function sha256hex(s) { return hex(await crypto.subtle.digest('SHA-256', utf8(s))); }
  async function idDe(correo) { return (await sha256hex(correo)).slice(0, 6); }

  // límite de dispositivos POR USUARIO: cada usuario puede abrir el reporte en hasta N equipos (navegadores).
  var RID = 'sn_' + (C.data && C.data.mac ? C.data.mac.slice(0, 24) : 'x');
  // id estable de este equipo/navegador
  function miEquipo() {
    try {
      var d = localStorage.getItem('sn_equipo');
      if (!d) { d = hex(crypto.getRandomValues(new Uint8Array(16))); localStorage.setItem('sn_equipo', d); }
      return d;
    } catch (e) { return 'sin-storage'; }
  }
  function candado() {
    try { var g = JSON.parse(localStorage.getItem(RID)); return g && g.u ? g : { u: {} }; } catch (e) { return { u: {} }; }
  }
  // ¿puede entrar este usuario en este equipo? (ya registrado aquí, o aún tiene cupo de equipos)
  function revisarDispositivo(uh, maxDev) {
    var g = candado(), eq = miEquipo(), lista = g.u[uh] || [];
    if (lista.indexOf(eq) >= 0) return { ok: true, usados: lista.length };
    if (lista.length < Math.max(1, maxDev)) return { ok: true, usados: lista.length };
    return { ok: false, usados: lista.length };
  }
  function registrarDispositivo(uh) {
    try {
      var g = candado(), eq = miEquipo(); g.u[uh] = g.u[uh] || [];
      if (g.u[uh].indexOf(eq) < 0) { g.u[uh].push(eq); localStorage.setItem(RID, JSON.stringify(g)); }
    } catch (e) { /* sin almacenamiento: se permite igual */ }
  }

  async function abrir(correo, clave) {
    var id = await idDe(correo);
    var lista = C.users.filter(function (u) { return u.id === id; });
    if (!lista.length) lista = C.users; // respaldo ante colisiones
    for (var i = 0; i < lista.length; i++) {
      var u = lista[i];
      var salt = b64a(u.s), ivU = b64a(u.iv), ctU = b64a(u.ct), macU = b64a(u.mac);
      var kk = await pbkdf2(correo + '\n' + clave, salt, C.it, 64);
      var encU = kk.slice(0, 32), macK = kk.slice(32, 64);
      if (!(await hmacOk(macK, junta(ivU, ctU), macU))) continue;
      var maestra = await aesDec(encU, ivU, ctU);         // 64 bytes
      var encM = maestra.slice(0, 32), macM = maestra.slice(32, 64);
      var d = C.data, ivD = b64a(d.iv), ctD = b64a(d.ct), macD = b64a(d.mac);
      if (!(await hmacOk(macM, junta(ivD, ctD), macD))) throw new Error('corrupto');
      var claro = await aesDec(encM, ivD, ctD);
      var txt = new TextDecoder().decode(claro);
      var nl = txt.indexOf('\n'), exp = txt.slice(0, nl), html = txt.slice(nl + 1);
      var uh = await sha256hex(correo), dev = Math.max(1, Math.min(4, u.dev || 1));
      if (exp !== '0' && Date.now() > +exp)
        return { venc: new Date(+exp), uh: uh, dev: dev };
      return { html: html, uh: uh, dev: dev };
    }
    return null;
  }

  $('form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var correo = norm($('correo').value), clave = $('clave').value.trim();
    if (!correo || !clave) { msg('Ingrese correo y contraseña.', 'err'); return; }
    var btn = $('entrar'); btn.disabled = true;
    var txt = btn.textContent; btn.innerHTML = '<span class="carg"></span>Verificando…';
    msg('', 'info'); aviso.className = 'aviso';
    try {
      var r = await abrir(correo, clave);
      if (!r) { msg('Correo o contraseña incorrectos.', 'err'); }
      else if (r.venc) { msg('El reporte venció el ' + r.venc.toLocaleDateString('es-PE') + '. Solicite uno nuevo a Smart Network.', 'err'); }
      else {
        // límite de dispositivos del usuario
        var disp = revisarDispositivo(r.uh, r.dev);
        if (!disp.ok) {
          msg('Alcanzaste el máximo de ' + r.dev + ' dispositivo(s) para este usuario. ' +
              'Usa un equipo donde ya ingresaste, o solicita un reporte nuevo a Smart Network.', 'err');
          var btn0 = $('entrar'); btn0.disabled = false; btn0.textContent = 'Ingresar'; return;
        }
        registrarDispositivo(r.uh);
        var sello = JSON.stringify({ correo: correo, fecha: new Date().toISOString() });
        var html = r.html.indexOf('"__SELLO_AQUI__"') >= 0 ? r.html.replace('"__SELLO_AQUI__"', sello) : r.html;
        document.open(); document.write(html); document.close();
        return;
      }
    } catch (e) {
      msg('No se pudo abrir el reporte: ' + e.message, 'err');
    }
    btn.disabled = false; btn.textContent = txt;
  });
})();
</script>
